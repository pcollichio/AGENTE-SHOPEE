<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cockpit Papai Resolve</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1f0; --card: #ffffff; --text: #14202b; --muted: #5b6b74;
    --border: #d7dfe0; --accent: #d9670c; --accent-ink: #a84e08; --accent-soft: #fbe7d4;
    --focus: #1d64b0; --bolha-usuario: #d9670c; --bolha-coach: #eef1f0;
    --erro: #d03b3b; --erro-soft: #f8e2e2;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1417; --card: #171e22; --text: #e7edf0; --muted: #93a2a9;
      --border: #2a3338; --accent: #ff9439; --accent-ink: #ffb066; --accent-soft: #3a2a17;
      --focus: #6badf0; --bolha-usuario: #ff9439; --bolha-coach: #0f1417;
      --erro: #e0776a; --erro-soft: #3a201c;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1417; --card: #171e22; --text: #e7edf0; --muted: #93a2a9;
    --border: #2a3338; --accent: #ff9439; --accent-ink: #ffb066; --accent-soft: #3a2a17;
    --focus: #6badf0; --bolha-usuario: #ff9439; --bolha-coach: #0f1417;
    --erro: #e0776a; --erro-soft: #3a201c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text); font-family: "IBM Plex Sans", system-ui, sans-serif;
    overflow: hidden;
  }

  .shell { display: flex; height: 100%; }

  /* --- Sidebar --- */
  .sidebar {
    width: 208px; flex-shrink: 0; background: var(--card); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; padding: 18px 12px;
  }
  .marca { display: flex; align-items: center; gap: 9px; font-family: "Archivo", sans-serif;
    font-weight: 800; font-size: 1rem; padding: 0 8px; margin-bottom: 22px; }
  .sidebar-links { display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .link {
    font-family: "IBM Plex Sans", sans-serif; font-size: 0.88rem; font-weight: 600;
    color: var(--muted); text-decoration: none; padding: 10px 12px; border-radius: 7px;
    border: none; background: transparent; cursor: pointer; text-align: left; display: block;
  }
  .link:hover { color: var(--text); background: var(--bg); }
  .link.ativo { background: var(--accent-soft); color: var(--accent-ink); }
  .link.externo { font-size: 0.8rem; color: var(--muted); margin-top: 8px; }
  .link:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

  /* --- Área de conteúdo --- */
  .area-conteudo { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .conteudo { flex: 1; border: none; width: 100%; }

  /* --- Painel de chat (persistente) --- */
  .painel-chat {
    width: 360px; flex-shrink: 0; background: var(--card); border-left: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0;
  }
  .chat-cabecalho {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 14px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .chat-titulo { display: flex; align-items: center; gap: 8px; font-family: "Archivo", sans-serif;
    font-weight: 700; font-size: 0.92rem; }
  .chat-titulo .eyebrow { display: block; font-family: "IBM Plex Mono", monospace; font-size: 0.66rem;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent-ink); font-weight: 600; }
  .btn-fechar-chat { display: none; }

  .chat-mensagens { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .msg { display: flex; }
  .msg-coach { justify-content: flex-start; }
  .msg-usuario { justify-content: flex-end; }
  .bolha { max-width: 88%; padding: 9px 12px; border-radius: 11px; font-size: 0.86rem; line-height: 1.5;
    white-space: pre-wrap; }
  .msg-coach .bolha { background: var(--bolha-coach); border: 1px solid var(--border); border-bottom-left-radius: 3px; }
  .msg-usuario .bolha { background: var(--bolha-usuario); color: #fff; border-bottom-right-radius: 3px; }
  .msg-erro .bolha { background: var(--erro-soft); color: var(--erro); border: 1px solid var(--erro); }
  .msg-carregando .bolha { color: var(--muted); font-style: italic; }

  .sugestoes { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 16px 12px; flex-shrink: 0; }
  .sugestao { font-family: "IBM Plex Sans", sans-serif; font-size: 0.74rem; font-weight: 600;
    color: var(--accent-ink); background: var(--accent-soft); border: none; border-radius: 999px;
    padding: 6px 11px; cursor: pointer; }
  .sugestao:hover { opacity: 0.85; }

  .chat-form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border); flex-shrink: 0; }
  .chat-form input { flex: 1; font-family: "IBM Plex Sans", sans-serif; font-size: 0.86rem; padding: 9px 12px;
    border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); min-width: 0; }
  .chat-form input:focus { outline: 2px solid var(--focus); outline-offset: 1px; }
  .chat-form button { font-family: "IBM Plex Sans", sans-serif; font-size: 0.85rem; font-weight: 700;
    color: #fff; background: var(--accent); border: none; border-radius: 8px; padding: 0 14px; cursor: pointer; flex-shrink: 0; }
  .chat-form button:disabled { opacity: 0.5; cursor: not-allowed; }
  .aviso-config { font-size: 0.74rem; color: var(--muted); margin: 0 16px 12px; font-family: "IBM Plex Mono", monospace; }

  /* --- Botão flutuante (só mobile) --- */
  .btn-chat-flutuante { display: none; }

  /* --- Sidebar mobile / responsivo --- */
  @media (max-width: 900px) {
    .shell { flex-direction: column; }
    .sidebar {
      width: 100%; flex-direction: row; align-items: center; padding: 10px 12px;
      border-right: none; border-bottom: 1px solid var(--border); overflow-x: auto;
    }
    .marca { margin-bottom: 0; flex-shrink: 0; }
    .sidebar-links { flex-direction: row; flex: 0; }
    .link { white-space: nowrap; padding: 8px 12px; }
    .link.externo { margin-top: 0; margin-left: 4px; }

    .painel-chat {
      position: fixed; inset: 0; width: auto; z-index: 30;
      transform: translateX(100%); transition: transform 0.22s ease;
    }
    .painel-chat.aberto { transform: translateX(0); }
    .btn-fechar-chat {
      display: flex; align-items: center; justify-content: center; width: 30px; height: 30px;
      border-radius: 7px; border: none; background: var(--bg); color: var(--text); cursor: pointer;
      font-size: 1rem;
    }

    .btn-chat-flutuante {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      position: fixed; bottom: 18px; right: 18px; z-index: 20;
      background: var(--accent); color: #fff; border: none; border-radius: 999px;
      padding: 13px 20px; font-family: "IBM Plex Sans", sans-serif; font-weight: 700; font-size: 0.88rem;
      cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,0.25);
    }
  }
</style>
</head>
<body>
  <div class="shell">
    <nav class="sidebar" id="sidebar">
      <div class="marca">
        <svg width="22" height="22" viewBox="0 0 120 120" fill="none">
          <circle cx="60" cy="60" r="52" stroke="#a84e08" stroke-width="6"/>
          <path d="M38 62 L54 78 L86 40" stroke="#d9670c" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Cockpit
      </div>
      <div class="sidebar-links">
        <button class="link ativo" data-arquivo="index.html">Início</button>
        <button class="link" data-arquivo="painel.html">Produtos</button>
        <button class="link" data-arquivo="esteira.html">Esteira</button>
        <button class="link" data-arquivo="importar.html">Importar</button>
        <button class="link" data-arquivo="painel_roi.html">Dashboard</button>
      </div>
      <a class="link externo" href="https://claude.ai/code/artifact/a5421828-0ecd-4bd1-8c5f-d3a2799c26bf" target="_blank" rel="noopener">Identidade&nbsp;&#8599;</a>
    </nav>

    <main class="area-conteudo">
      <iframe class="conteudo" id="conteudo" src="index.html" title="Conteúdo do cockpit"></iframe>
    </main>

    <aside class="painel-chat" id="painel-chat">
      <header class="chat-cabecalho">
        <div class="chat-titulo">
          <span class="eyebrow">Papai Resolve</span>
          Coach
        </div>
        <button class="btn-fechar-chat" id="btn-fechar-chat" aria-label="Fechar chat">&#10005;</button>
      </header>
      <div class="chat-mensagens" id="chat-mensagens">
        <div class="msg msg-coach">
          <div class="bolha">Oi! Posso te dizer o que fazer agora, explicar os números do ROI ou ajudar a decidir o próximo produto — sem sair da tela que você está vendo.</div>
        </div>
      </div>
      <div class="sugestoes">
        <button class="sugestao" type="button" data-msg="O que eu faço agora?">O que eu faço agora?</button>
        <button class="sugestao" type="button" data-msg="Como está o ROI do mês?">ROI do mês</button>
        <button class="sugestao" type="button" data-msg="O que está na esteira?">Esteira</button>
      </div>
      <form class="chat-form" id="chat-form">
        <input type="text" id="chat-input" placeholder="Pergunte algo..." autocomplete="off">
        <button type="submit" id="chat-enviar">&#10148;</button>
      </form>
      <p class="aviso-config" id="aviso-config" hidden>
        O chat ainda não está configurado (falta a chave da Anthropic na Vercel).
      </p>
    </aside>

    <button class="btn-chat-flutuante" id="btn-abrir-chat" type="button">&#128172; Chat</button>
  </div>

  <script>
    (function () {
      document.querySelectorAll('.link[data-arquivo]').forEach(function (botao) {
        botao.addEventListener('click', function () {
          document.querySelectorAll('.link[data-arquivo]').forEach(function (b) { b.classList.remove('ativo'); });
          botao.classList.add('ativo');
          document.getElementById('conteudo').src = botao.getAttribute('data-arquivo');
        });
      });
    })();

    (function () {
      var painelChat = document.getElementById('painel-chat');
      var btnAbrir = document.getElementById('btn-abrir-chat');
      var btnFechar = document.getElementById('btn-fechar-chat');
      if (btnAbrir) btnAbrir.addEventListener('click', function () { painelChat.classList.add('aberto'); });
      if (btnFechar) btnFechar.addEventListener('click', function () { painelChat.classList.remove('aberto'); });

      var historico = [];
      var lista = document.getElementById('chat-mensagens');
      var form = document.getElementById('chat-form');
      var campo = document.getElementById('chat-input');
      var botao = document.getElementById('chat-enviar');
      var avisoConfig = document.getElementById('aviso-config');

      function rolarParaFinal() {
        lista.scrollTop = lista.scrollHeight;
      }

      function adicionarBolha(texto, tipo) {
        var div = document.createElement('div');
        div.className = 'msg msg-' + tipo;
        var bolha = document.createElement('div');
        bolha.className = 'bolha';
        bolha.textContent = texto;
        div.appendChild(bolha);
        lista.appendChild(div);
        rolarParaFinal();
        return div;
      }

      async function enviar(texto) {
        if (!texto.trim()) return;
        adicionarBolha(texto, 'usuario');
        historico.push({ role: 'user', content: texto });
        campo.value = '';
        botao.disabled = true;
        var carregando = adicionarBolha('Pensando...', 'carregando');

        try {
          var resposta = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ mensagens: historico }),
          });
          var dados = await resposta.json();
          carregando.remove();

          if (!resposta.ok) {
            if (resposta.status === 500 && dados.erro && dados.erro.indexOf('ANTHROPIC_API_KEY') !== -1) {
              avisoConfig.hidden = false;
            }
            adicionarBolha(dados.erro || 'Deu um erro ao falar com o coach.', 'erro');
            return;
          }

          adicionarBolha(dados.resposta, 'coach');
          historico.push({ role: 'assistant', content: dados.resposta });
        } catch (e) {
          carregando.remove();
          adicionarBolha('Não consegui falar com o servidor do chat. Verifique sua conexão.', 'erro');
        } finally {
          botao.disabled = false;
          campo.focus();
        }
      }

      form.addEventListener('submit', function (ev) {
        ev.preventDefault();
        enviar(campo.value);
      });

      document.querySelectorAll('.sugestao').forEach(function (b) {
        b.addEventListener('click', function () {
          enviar(b.getAttribute('data-msg'));
        });
      });
    })();
  </script>
</body>
</html>
