name: Testar sincronização de vendas via API (conversionReport)

on:
  workflow_dispatch:
    inputs:
      dias:
        description: "Quantos dias pra trás buscar"
        required: false
        default: "30"

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cockpit-shopee
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar sincronizar_vendas.py de verdade (sem commitar o CSV)
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
          USE_MOCK_DATA: "false"
        run: |
          sed -i "s/^DIAS_PARA_TRAS = .*/DIAS_PARA_TRAS = ${{ inputs.dias }}/" sincronizar_vendas.py
          python3 sincronizar_vendas.py
          echo "--- Conteudo gerado (financeiro/vendas_shopee.csv) ---"
          cat financeiro/vendas_shopee.csv
          git diff --stat -- financeiro/vendas_shopee.csv || true
