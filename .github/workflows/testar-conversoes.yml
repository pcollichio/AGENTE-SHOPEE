name: Testar sincronização de vendas via API (conversionReport)

on:
  workflow_dispatch:
    inputs:
      dias:
        description: "Quantos dias pra trás buscar"
        required: false
        default: "30"

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cockpit-shopee
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Testar conversionReport com queries progressivas (bisseção de campo)
        env:
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_APP_SECRET: ${{ secrets.SHOPEE_APP_SECRET }}
          USE_MOCK_DATA: "false"
        run: |
          python3 -c "
          import json
          from datetime import datetime, timedelta, timezone
          from shopee_integration import client

          dias = int('${{ inputs.dias }}' or '30')
          fim = datetime.now(timezone.utc)
          inicio = fim - timedelta(days=dias)
          inicio_ts, fim_ts = str(int(inicio.timestamp())), str(int(fim.timestamp()))
          print(f'Periodo: {inicio.date()} ate {fim.date()} ({dias} dias)')

          variantes = {
            'V1 so conversionId': 'conversionId',
            'V2 + purchaseTime conversionStatus totalCommission': 'conversionId purchaseTime conversionStatus totalCommission',
            'V3 + orders{orderId}': 'conversionId purchaseTime conversionStatus totalCommission orders { orderId }',
            'V4 + orders{orderId orderStatus}': 'conversionId purchaseTime conversionStatus totalCommission orders { orderId orderStatus }',
            'V5 + items{itemId}': 'conversionId purchaseTime conversionStatus totalCommission orders { orderId orderStatus items { itemId } } ',
            'V6 + items{itemName}': 'conversionId purchaseTime conversionStatus totalCommission orders { orderId orderStatus items { itemId itemName } }',
            'V7 completa (itemTotalCommission)': 'conversionId purchaseTime conversionStatus totalCommission orders { orderId orderStatus items { itemId itemName itemTotalCommission } }',
          }

          for nome, campos in variantes.items():
              query = f'''
              query BuscarConversoes(\$inicio: Int64, \$fim: Int64, \$limit: Int) {{
                conversionReport(purchaseTimeStart: \$inicio, purchaseTimeEnd: \$fim, limit: \$limit) {{
                  nodes {{ {campos} }}
                  pageInfo {{ hasNextPage scrollId }}
                }}
              }}
              '''
              try:
                  dados = client._executar_graphql(query, {'inicio': inicio_ts, 'fim': fim_ts, 'limit': 20})
                  nodes = (dados.get('conversionReport') or {}).get('nodes') or []
                  print(f'{nome}: OK, {len(nodes)} node(s)')
                  if nodes:
                      print('  exemplo:', json.dumps(nodes[0], ensure_ascii=False))
              except Exception as e:
                  print(f'{nome}: ERRO -> {e}')
          "
